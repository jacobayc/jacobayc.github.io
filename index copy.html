<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Gateway</title>
  <style>
    :root {
      --bg: #050510;
      --primary: #7cf6ff;
      --secondary: #a78bfa;
      --accent: #22d3ee;
      --text: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont;
      background: radial-gradient(circle at bottom, #0b1026, #02030a 70%);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== STARFIELD ===== */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ===== MAIN LAYOUT ===== */
    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .badge {
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(124, 246, 255, 0.12);
      border: 1px solid rgba(124, 246, 255, 0.4);
      color: var(--primary);
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.1;
      margin-bottom: 1.2rem;
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s ease-in-out infinite alternate;
    }

    p {
      max-width: 640px;
      font-size: 1.1rem;
      opacity: 0.85;
      margin-bottom: 3rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      position: relative;
      padding: 0.9rem 1.6rem;
      border-radius: 14px;
      font-size: 0.95rem;
      color: #02030a;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 30px rgba(34, 211, 238, 0.35);
    }

    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: none;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,255,255,0.35), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .btn:hover::after {
      opacity: 1;
    }

    footer {
      position: absolute;
      bottom: 24px;
      font-size: 0.75rem;
      opacity: 0.4;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes glow {
      from { filter: drop-shadow(0 0 12px rgba(124,246,255,0.35)); }
      to { filter: drop-shadow(0 0 28px rgba(167,139,250,0.6)); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    /* ===== PLANET ===== */
    .planet {
      position: absolute;
      bottom: -20%;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e3a8a, #020617 70%);
      box-shadow: inset -40px -60px 120px rgba(0,0,0,0.7), 0 0 120px rgba(124,246,255,0.25);
      z-index: 1;
      animation: rise 12s ease-in-out infinite alternate;
    }

    @keyframes rise {
      from { transform: translateY(0px); }
      to { transform: translateY(-40px); }
    }

    @media (max-width: 640px) {
      p { font-size: 1rem; }
      .planet { width: 360px; height: 360px; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="planet"></div>

  <main class="container">
    <div class="badge">🚀 yaechan1990@gmail.com</div>
    <h1>Explore Your APIs
      <br />Beyond Earth</h1>
    <p>
      정적 JSON 기반 Mock API와 관리 UI를 하나의 우주처럼 설계하세요.
      빠르고, 단순하며, 어디서든 호출 가능한 새로운 개발 공간입니다.
    </p>

    <div class="actions">
      <!-- <button class="btn" onclick="location.href='/api'">View APIs</button> -->
      <button class="btn secondary" onclick="location.href='/app'">Launch Console</button>
    </div>

    <footer>© 2025 Cosmic Gateway · Built on GitHub Pages</footer>
  </main>

  <script>
    /* ===== STARFIELD SCRIPT ===== */
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    let w, h, stars;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      stars = Array.from({ length: Math.floor(w * h / 8000) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random() * w
      }));
    }

    function animate() {
      ctx.fillStyle = 'rgba(2,3,10,0.4)';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#7cf6ff';
      stars.forEach(s => {
        s.z -= 2;
        if (s.z <= 0) s.z = w;
        const k = 128 / s.z;
        const px = s.x * k + w / 2;
        const py = s.y * k + h / 2;
        if (px >= 0 && px <= w && py >= 0 && py <= h) {
          const size = (1 - s.z / w) * 2;
          ctx.fillRect(px, py, size, size);
        }
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();

    /* ===== BUTTON HOVER RIPPLE ===== */
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('mousemove', e => {
        const rect = btn.getBoundingClientRect();
        btn.style.setProperty('--x', `${e.clientX - rect.left}px`);
        btn.style.setProperty('--y', `${e.clientY - rect.top}px`);
      });
    });
  </script>
</body>
</html>
